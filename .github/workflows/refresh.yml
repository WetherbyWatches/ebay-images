name: Daily eBay image refresh
# Redraws the feedback panel and newest-listing images from Wetherby Watches' public eBay pages.
# No secrets: it reads public eBay pages and commits with GitHub's built-in token.
on:
  schedule:
    - cron: "30 6 * * *"   # 06:30 UTC = 06:30 UK in winter, 07:30 in summer
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-liberation
      - run: pip install --quiet pillow
      - name: Read eBay and redraw images (keeps yesterday's images if eBay blocks the read)
        run: |
          python3 job/fetch_data.py
          python3 job/render_images.py .
      - name: Commit changed images
        run: |
          git config user.name "ww-image-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily image refresh $(date -u +%F)"
          git push
